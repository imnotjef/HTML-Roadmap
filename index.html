<!DOCTYPE html> <!-- It tells the browser that it's HTML5. -->
<html lang="en"> <!-- root of the page, defines the language. -->
<head> <!-- page settings (not displayed on screen) -->
    <meta charset="UTF-8"> <!-- Support for accents and special characters.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Makes the page responsive on mobile devices. -->
    <title>Document</title> <!-- Title of the page, shown in the browser tab. -->
</head>
<body> <!-- content of the page, displayed on screen -->
    <h1> </h1> <!-- Heading 1, largest heading. -->
    <p> </p> <!-- A paragraph of text. -->
   
</body>
</html> <!-- End of the HTML document. -->
